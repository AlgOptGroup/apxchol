[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "apxchol"
version = "0.3.0"
description = "CPU approximate-Cholesky preconditioner for graph-Laplacian / SDDM linear systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.7"]
authors = [
    {name = "Oleksandr Kulkov"},
    {name = "Yves Baumann"},
    {name = "Rasmus Kyng"},
]
keywords = ["laplacian", "preconditioner", "cholesky", "sparse", "pcg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/AlgOptGroup/apxchol"
Repository = "https://github.com/AlgOptGroup/apxchol"
Issues = "https://github.com/AlgOptGroup/apxchol/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.16"
wheel.packages = ["apxchol"]
build-dir = "build/{wheel_tag}"
wheel.license-files = ["LICENSE", "LICENSE.libomp.txt"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
test-command = "python -m pytest {package}/tests -q"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = '''
set -eu
dnf install -y libomp-devel
# Make the distro header visible to the separately installed Clang toolchain.
ln -s "$(rpm -ql libomp-devel | grep '/omp.h$')" /usr/local/include/omp.h
manylinux-install-clang -v v22.1.8.1
'''
# Includes PyPA's pinned Clang installer; keep the glibc 2.28 compatibility floor.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b"

[tool.cibuildwheel.linux.environment]
APXCHOL_PORTABLE_BUILD = "1"
CC = "/opt/clang/bin/clang"
CXX = "/opt/clang/bin/clang++"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install libomp"

[tool.cibuildwheel.macos.environment]
APXCHOL_PORTABLE_BUILD = "1"
MACOSX_DEPLOYMENT_TARGET = "15.0"
# cibuildwheel 3.2 otherwise sets _PYTHON_HOST_PLATFORM to macOS 11, which
# scikit-build-core prioritizes over MACOSX_DEPLOYMENT_TARGET for the wheel tag.
_PYTHON_HOST_PLATFORM = "macosx-15.0-arm64"
