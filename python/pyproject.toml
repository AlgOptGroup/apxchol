[build-system]
requires = ["scikit-build-core>=0.12", "pybind11>=3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "apxchol"
dynamic = ["version", "license"]
description = "Approximate-Cholesky preconditioner for graph-Laplacian / SDDM linear systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.21"]
authors = [
    {name = "Oleksandr Kulkov"},
    {name = "Yves Baumann"},
    {name = "Rasmus Kyng"},
]
keywords = ["laplacian", "preconditioner", "cholesky", "sparse", "pcg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/AlgOptGroup/apxchol"
Repository = "https://github.com/AlgOptGroup/apxchol"
Issues = "https://github.com/AlgOptGroup/apxchol/issues"

[project.optional-dependencies]
scipy = ["scipy>=1.7"]
test = ["pytest>=7"]

[tool.scikit-build]
minimum-version = "0.12"
cmake.version = ">=3.20"
wheel.packages = ["apxchol"]
build-dir = "build/{wheel_tag}"
wheel.license-files = ["LICENSE*"]

# Wheels also contain Eigen (MPL-2.0), pybind11 (BSD-3-Clause), the LLVM
# OpenMP runtime (Apache-2.0 WITH LLVM-exception) and zlib's notice. CUDA
# builds add the CUDA runtime under the NVIDIA CUDA EULA, plus CCCL; the Linux
# wheel job copies both license texts from the installed toolkit. Each license
# text is under the wheel's .dist-info/licenses.
[tool.scikit-build.metadata.license]
provider = "scikit_build_core.metadata.template"
result = "BSD-3-Clause AND MPL-2.0 AND Apache-2.0 WITH LLVM-exception AND Zlib"

[[tool.scikit-build.overrides]]
if.env.CMAKE_ARGS = ".*-DAPXCHOL_DEVICE=CUDA.*"
metadata.license.provider = "scikit_build_core.metadata.template"
metadata.license.result = "BSD-3-Clause AND MPL-2.0 AND Apache-2.0 WITH LLVM-exception AND Zlib AND LicenseRef-NVIDIA-CUDA-EULA"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../cmake/apxchol_version.cmake"
regex = '^set\(APXCHOL_VERSION (?P<value>[0-9]+\.[0-9]+\.[0-9]+)\)$'

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_*"
# Fetch the upstream license for the OpenMP runtime bundled by wheel repair.
before-build = 'curl -fsSL --retry 3 https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-21.1.8/openmp/LICENSE.TXT -o "{package}/LICENSE.libomp.txt"'
test-extras = ["test", "scipy"]
test-command = "python -m pytest {package}/tests -q"
config-settings = { "cmake.define.APXCHOL_NATIVE_ARCH" = "OFF", "cmake.define.CMAKE_COMPILE_WARNING_AS_ERROR" = "ON", "cmake.version" = ">=4.4" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = '''
set -eu
dnf install -y clang libomp-devel dnf-plugins-core
# EPEL 8's ccache predates current CUDA support and cache statistics.
curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-linux-x86_64-musl-static.tar.gz -o /tmp/apxchol-ccache.tar.gz
printf '%s  %s\n' d540ba01f160addbd3dd5e18eda9bd34005591b095c09ac8ae9d0a1b655e7ef5 /tmp/apxchol-ccache.tar.gz | sha256sum -c -
tar -xzf /tmp/apxchol-ccache.tar.gz --strip-components=1 -C /usr/local/bin ccache-4.14.2-linux-x86_64-musl-static/ccache
dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
dnf install -y cuda-nvcc-13-4 cuda-cudart-devel-13-4
cp /usr/share/licenses/cuda-cudart-13-4/LICENSE "{package}/LICENSE.cuda.txt"
cp /usr/share/licenses/cccl-13-4/LICENSE "{package}/LICENSE.cccl.txt"
'''
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.linux.environment]
CC = "clang"
CXX = "clang++"
CUDACXX = "/usr/local/cuda-13.4/bin/nvcc"
CUDAHOSTCXX = "clang++"
CMAKE_ARGS = "-DAPXCHOL_DEVICE=CUDA -DCMAKE_CUDA_ARCHITECTURES=all-major"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install libomp ccache"

[tool.cibuildwheel.macos.environment]
CMAKE_ARGS = "-DAPXCHOL_DEVICE=METAL"
MACOSX_DEPLOYMENT_TARGET = "15.0"
# scikit-build-core prefers this over MACOSX_DEPLOYMENT_TARGET for the wheel tag.
_PYTHON_HOST_PLATFORM = "macosx-15.0-arm64"
