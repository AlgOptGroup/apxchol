[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "apxchol"
version = "0.3.0"
description = "CPU approximate-Cholesky preconditioner for graph-Laplacian / SDDM linear systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.7"]
authors = [
    {name = "Oleksandr Kulkov"},
    {name = "Yves Baumann"},
    {name = "Rasmus Kyng"},
]
keywords = ["laplacian", "preconditioner", "cholesky", "sparse", "pcg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/AlgOptGroup/apxchol"
Repository = "https://github.com/AlgOptGroup/apxchol"
Issues = "https://github.com/AlgOptGroup/apxchol/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.16"
wheel.packages = ["apxchol"]
build-dir = "build/{wheel_tag}"
wheel.license-files = ["LICENSE", "LICENSE.libomp.txt"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
test-command = "python -m pytest {package}/tests -q"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = "dnf install -y clang libomp-devel"

[tool.cibuildwheel.linux.environment]
APXCHOL_PORTABLE_BUILD = "1"
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# The runner's Homebrew bottle requires macOS 15; this prebuilt runtime supports 11+.
before-all = '''
set -eu
curl -fsSL --retry 3 https://mac.r-project.org/openmp/openmp-19.1.5-darwin20-Release.tar.gz -o /tmp/apxchol-libomp.tar.gz
printf 'b5cb9ea68b217f165f84e0d1aef115b11524ba5513c14517da52fc40e61ef4ea  /tmp/apxchol-libomp.tar.gz\n' | shasum -a 256 -c -
mkdir -p /tmp/apxchol-libomp
tar -xzf /tmp/apxchol-libomp.tar.gz -C /tmp/apxchol-libomp --strip-components=2
install_name_tool -id /tmp/apxchol-libomp/lib/libomp.dylib /tmp/apxchol-libomp/lib/libomp.dylib
'''

[tool.cibuildwheel.macos.environment]
APXCHOL_PORTABLE_BUILD = "1"
MACOSX_DEPLOYMENT_TARGET = "14.0"
# cibuildwheel 3.2 otherwise sets _PYTHON_HOST_PLATFORM to macOS 11, which
# scikit-build-core prioritizes over MACOSX_DEPLOYMENT_TARGET for the wheel tag.
_PYTHON_HOST_PLATFORM = "macosx-14.0-arm64"
CMAKE_ARGS = "-DOpenMP_ROOT=/tmp/apxchol-libomp"
