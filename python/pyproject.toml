[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "apxchol"
version = "0.3.0"
description = "CPU approximate-Cholesky preconditioner for graph-Laplacian / SDDM linear systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.7"]
authors = [
    {name = "Oleksandr Kulkov"},
    {name = "Yves Baumann"},
    {name = "Rasmus Kyng"},
]
keywords = ["laplacian", "preconditioner", "cholesky", "sparse", "pcg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/AlgOptGroup/apxchol"
Repository = "https://github.com/AlgOptGroup/apxchol"
Issues = "https://github.com/AlgOptGroup/apxchol/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.16"
wheel.packages = ["apxchol"]
build-dir = "build/{wheel_tag}"
# Explicit: the default LICEN[CS]E* glob would also pick up LICENSE.libomp.txt.
wheel.license-files = ["LICENSE"]

# macOS wheels bundle LLVM's OpenMP runtime; ship its license with them only.
[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
wheel.license-files = ["LICENSE", "LICENSE.libomp.txt"]

# macOS arm64 wheels. libomp is built from LLVM source for the wheel's
# deployment target (Homebrew bottles target the runner's OS); 14.0 is the
# first macOS whose libc++ ships std::pmr. The Linux wheels keep their
# workflow-level CIBW_* settings.
[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "bash {package}/tools/build_libomp_macos.sh /tmp/apxchol-libomp-cibuildwheel"
environment = { APXCHOL_PORTABLE_BUILD = "1", MACOSX_DEPLOYMENT_TARGET = "14.0", CMAKE_ARGS = "-DOpenMP_ROOT=/tmp/apxchol-libomp-cibuildwheel" }
test-requires = ["pytest"]
test-command = "pytest {package}/tests -q && python {package}/tools/check_macos_runtime.py"
