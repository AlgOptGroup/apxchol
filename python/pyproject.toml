[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "apxchol"
version = "0.3.0"
description = "CPU approximate-Cholesky preconditioner for graph-Laplacian / SDDM linear systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.21", "scipy>=1.7"]
authors = [
    {name = "Oleksandr Kulkov"},
    {name = "Yves Baumann"},
    {name = "Rasmus Kyng"},
]
keywords = ["laplacian", "preconditioner", "cholesky", "sparse", "pcg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/AlgOptGroup/apxchol"
Repository = "https://github.com/AlgOptGroup/apxchol"
Issues = "https://github.com/AlgOptGroup/apxchol/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.16"
wheel.packages = ["apxchol"]
build-dir = "build/{wheel_tag}"
wheel.license-files = ["LICENSE"]

[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
wheel.license-files = ["LICENSE", "LICENSE.libomp.txt"]

[[tool.scikit-build.overrides]]
if.platform-system = "linux"
wheel.license-files = ["LICENSE", "LICENSE.libgomp.txt"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
environment = { APXCHOL_PORTABLE_BUILD = "1" }
test-requires = ["pytest"]
test-command = "python -m pytest {package}/tests -q"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "bash {package}/tools/build_libomp_macos.sh /tmp/apxchol-libomp-cibuildwheel"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_*"
inherit.environment = "append"
# cibuildwheel 3.2 otherwise sets _PYTHON_HOST_PLATFORM to macOS 11, which
# scikit-build-core prioritizes over MACOSX_DEPLOYMENT_TARGET for the wheel tag.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", _PYTHON_HOST_PLATFORM = "macosx-14.0-arm64", CMAKE_ARGS = "-DOpenMP_ROOT=/tmp/apxchol-libomp-cibuildwheel" }
inherit.test-command = "append"
test-command = "python {package}/tools/check_macos_runtime.py"
