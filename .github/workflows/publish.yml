# Wheels-only PyPI publishing (no sdist — python/CMakeLists.txt references
# ../src, so the package only builds from a full checkout).
# Trigger: publishing a GitHub release (or manual dispatch to dry-run the build
# job). Uses PyPI Trusted Publishing (OIDC), configured on pypi.org under
# "Publishing" with: owner=AlgOptGroup, repo=apxchol,
# workflow=publish.yml, environment=pypi. No API tokens needed.
name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cmake -DRELEASE_TAG="$RELEASE_TAG" -P cmake/check_release_version.cmake

  wheels:
    needs: version
    uses: ./.github/workflows/wheels.yml

  pypy:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/pypy.yml

  publish:
    name: upload to PyPI (wheels only)
    needs: wheels
    # workflow_dispatch only dry-runs the wheel jobs; uploads happen on a release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
