# Python wheel, standalone CLI and native SDK publishing (no sdist — python/CMakeLists.txt references
# ../src, so the package only builds from a full checkout).
# Trigger: publishing a GitHub release (or manual dispatch to dry-run the artifact
# jobs). A prerelease builds everything and attaches the CLI and SDK archives,
# but does not upload to PyPI. Uses PyPI Trusted Publishing (OIDC), configured on pypi.org under
# "Publishing" with: owner=AlgOptGroup, repo=apxchol,
# workflow=publish.yml, environment=pypi. No API tokens needed.
name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cmake -DRELEASE_TAG="$RELEASE_TAG" -P cmake/check_release_version.cmake

  wheels:
    needs: version
    uses: ./.github/workflows/wheels.yml

  pypy:
    needs: version
    uses: ./.github/workflows/pypy.yml

  cli:
    needs: version
    uses: ./.github/workflows/cli.yml

  sdk:
    needs: version
    uses: ./.github/workflows/sdk.yml

  publish:
    name: upload to PyPI (wheels only)
    needs: [wheels, pypy, cli, sdk]
    # workflow_dispatch only builds artifacts; PyPI uploads happen on a final
    # release. A PyPI version can be uploaded only once.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheels-linux-x86_64-cuda,wheels-macos-arm64-metal,pypy-linux-x86_64-cuda,pypy-macos-arm64-metal}'
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-native:
    needs: [wheels, pypy, cli, sdk]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: '{sdk-linux-x86_64-cpu,sdk-linux-x86_64-cuda,sdk-macos-arm64-metal}'
          merge-multiple: true
          path: dist
      - name: Attach CLI and SDK archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd dist && sha256sum -c -- *.sha256)
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY"
