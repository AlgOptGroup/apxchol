# Temporary diagnostic branch only. Do not merge this workflow reduction.
# Reuses the registered ci.yml workflow so dispatch works without a main change.
name: ci
run-name: Metal SDK diagnostic at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metal-sdk-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metal-sdk-diagnostic:
    if: github.ref == 'refs/heads/codex/metal-sdk-hosted-diagnostic'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      MTL_DEBUG_LAYER: '1'
      MTL_SHADER_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source and Apple Silicon environment
        shell: bash
        run: |
          mkdir -p diagnostic-logs
          test "$(uname -m)" = arm64
          {
            git rev-parse HEAD
            uname -a
            sw_vers
            xcodebuild -version
            clang++ --version
          } 2>&1 | tee diagnostic-logs/environment.log
      - name: Build installed Metal SDK and check CPU/GPU roundtrips once
        shell: bash
        run: |
          brew install libomp
          bash .github/scripts/build-sdk.sh METAL 2>&1 | tee diagnostic-logs/build.log
          python3 tests/check_sdk_archive.py dist/*.tar.gz tests/cmake_install cpu gpu 2>&1 | tee diagnostic-logs/consumer.log
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-sdk-diagnostic-${{ github.run_id }}
          path: diagnostic-logs/
          if-no-files-found: warn
          retention-days: 7
