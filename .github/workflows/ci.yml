# Build + TEST CI for the library, CPU bindings and native benchmark. Kept lean and
# path-filtered so it only runs when C++/build/package files change, not on
# doc/chart commits.
#
# Five job definitions; the library compiler matrix expands to two jobs:
#   benchmark-harness — harness unit tests, CPU build and native CLI/stopping contracts
#   library  — parent CMake consumer under GCC and Clang, full suite (ctest)
#   macos    — parent CMake consumer under Apple Clang + Homebrew libomp, full suite
#   python   — manylinux wheel build + pytest (also the PORTABILITY check: the
#              old-glibc environment the release wheels are built in)
#   octave   — mkoctfile MEX + the Octave test suite
name: ci

on:
  # Manual runs, e.g. of a branch on a fork before it is proposed.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'benchmarks/**/*.py'
      - 'benchmarks/requirements.txt'
      - 'benchmarks/CMakeLists.txt'
      - 'benchmarks/src/**'
      - 'benchmarks/tests/**'
      - 'benchmarks/patches/**'
      - 'python/**'
      - 'octave/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'benchmarks/**/*.py'
      - 'benchmarks/requirements.txt'
      - 'benchmarks/CMakeLists.txt'
      - 'benchmarks/src/**'
      - 'benchmarks/tests/**'
      - 'benchmarks/patches/**'
      - 'python/**'
      - 'octave/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-harness:
    name: benchmark harness (unit tests + native contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
    steps:
      - uses: actions/checkout@v4
        with:
          # Stale-cell tests exercise ancestry against recorded fix commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install harness dependencies
        run: python -m pip install -r benchmarks/requirements.txt
      - name: Test harness
        run: python -B -m unittest discover -s benchmarks/tests -p 'test_*.py'
      - name: Install native benchmark dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-14 libeigen3-dev ninja-build
      - name: Configure + build native benchmark
        run: |
          cmake -S benchmarks -B build-benchmark -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14 \
                -DAPXCHOL_NATIVE_ARCH=OFF -DAPXCHOL_USE_CUDA=OFF \
                -DBENCH_HYPRE_USE_CUDA=OFF -DBUILD_GPU_RCHOL=OFF \
                -DAPXCHOL_RCHOL_PORTABLE_PCG=ON -DAPXCHOL_BENCH_FETCH_METIS=OFF \
                -DCMAKE_DISABLE_FIND_PACKAGE_Boost=ON
          cmake --build build-benchmark --target benchmark original_stop_tests split_components_tests -j2
      - name: Run native benchmark contracts
        run: ctest --test-dir build-benchmark --no-tests=error --output-on-failure --timeout 60

  library:
    name: library (${{ matrix.name }}, build + ctest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
            packages: g++-14
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libomp-18-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # Public headers require C++23. Test both supported
          # compiler families; the Python/Octave jobs below retain their own
          # distribution-portability toolchains.
          sudo apt-get install -y ${{ matrix.packages }} libeigen3-dev ninja-build
      - name: Configure + build (Release)
        run: |
          cmake -S tests/cmake_consumer -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build -j"$(nproc)"
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (${{ matrix.name }}, build + ctest)
    # macos-15 carries the oldest Apple Clang (Xcode 16) the library supports.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both entries also build the developer tools (analyze_factor with and
          # without its Metal backend).
          - name: Apple Clang + libomp
            cmake_args: '-DAPXCHOL_BUILD_TOOLS=ON'
          - name: Apple Clang + libomp + Metal
            cmake_args: '-DAPXCHOL_USE_METAL=ON -DAPXCHOL_BUILD_TOOLS=ON'
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # CMake and Ninja are preinstalled. No Homebrew Eigen: it is 5.x, which
        # the root's find_package(Eigen3 3.3) ignores in favour of the fetch.
        run: brew install libomp
      - name: Toolchain
        run: xcrun clang++ --version && cmake --version
      - name: Configure + build (Release)
        run: |
          cmake -S tests/cmake_consumer -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                ${{ matrix.cmake_args }}
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Check OpenMP linkage
        run: otool -L build/apxchol/tests/unit_tests | grep -q libomp
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  python:
    name: python (manylinux wheel + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One Python only (cp312) — same manylinux path as the release wheels, so
      # it catches the old-environment portability breaks ubuntu-latest can't,
      # and runs the package test suite inside the built wheel.
      - name: Build wheel + run pytest
        uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
          CIBW_ENVIRONMENT: APXCHOL_PORTABLE_BUILD=1
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/python/tests -v
        with:
          package-dir: python

  octave:
    name: octave (mkoctfile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # g++-14 for the C++23 core (mkoctfile honors the CXX env var below).
          # octave-dev (not liboctave-dev) provides mkoctfile on Ubuntu 24.04.
          # Skip optional Java, plotting and documentation packages. Keep the
          # pthread BLAS/LAPACK runtime selected by the full Octave install.
          sudo apt-get install -y --no-install-recommends \
            g++-14 octave octave-dev libeigen3-dev libopenblas0-pthread
      - name: Build MEX + run tests
        env:
          CXX: g++-14
        run: |
          cd octave
          ./build.sh
          octave --no-gui --eval "addpath(pwd); run('tests/test_apxchol.m')"
