extends: existence
message: Use a precise time or number instead of '%s'.
level: error
scope: text
ignorecase: true
tokens:
  - 'soon'
  - 'shortly'
  - 'a while'
  - 'eventually'
  - '(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)\s+(?:seconds?|minutes?|hours?|days?|weeks?|months?|times|threads?|files?|steps?|results?|GB|MB|TB)'
